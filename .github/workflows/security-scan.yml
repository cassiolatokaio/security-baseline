name: "Segurança Global (Cérebro)"

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string

jobs:
  procurar-segredos:
    name: Procurar Senhas Vazadas
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Gitleaks (Scanner de Segredos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  procurar-vulnerabilidades:
    name: Procurar Pacotes Perigosos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Trivy (Scanner de Dependências)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # NOVO ROBÔ ADICIONADO AQUI EMBAIXO:
  procurar-codigo-inseguro:
    name: Procurar Falhas no Código (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Semgrep (Scanner de Código)
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/default" # Regras oficiais de segurança
